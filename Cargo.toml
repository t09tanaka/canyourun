[package]
name = "remote-task-runner"
version = "0.0.0"
edition = "2021"
rust-version = "1.89"
description = "Distribute CI and heavy commands across your own machines"
license = "MIT"
repository = "https://github.com/t09tanaka/remote-task-runner"
readme = "README.md"

[lib]
name = "remote_task_runner"
path = "src/lib.rs"

[[bin]]
name = "remote-task-runner"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
local-ci = "0.9"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
task-traffic-controller = "0.5"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "process"] }
toml = "0.8"
ulid = "1"
unicode-normalization = "0.1.26"

[dev-dependencies]
assert_cmd = "2"
